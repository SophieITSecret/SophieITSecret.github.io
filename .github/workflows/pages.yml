name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (不要ファイル除外)
        run: |
          mkdir -p _deploy
          rsync -a --exclude='staging/BarSophie' \
                   --exclude='staging/BarSophie_TEST' \
                   --exclude='staging/TAKERU/editor' \
                   --exclude='_config.yml' \
                   --exclude='.git' \
                   --exclude='.github' \
                   --exclude='_deploy' \
                   . _deploy/
          touch _deploy/.nojekyll

      - name: Deploy to gh-pages branch
        run: |
          cd _deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
